<section class="parameter-panel">
    <h3>Điều chỉnh tham số</h3>

    <label>
        LABEL_PLACEHOLDER:
        <b id="param-value">DEFAULT_PLACEHOLDER</b>
    </label>

    <input
        id="param-slider"
        type="range"
        min="MIN_PLACEHOLDER"
        max="MAX_PLACEHOLDER"
        step="STEP_PLACEHOLDER"
        value="DEFAULT_PLACEHOLDER"
    >

    <p id="param-caption">
        Kéo thanh trượt để quan sát sự thay đổi.
    </p>
</section>
